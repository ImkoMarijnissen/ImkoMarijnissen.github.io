# this file contains the social media links and usernames of the author
# the socials will be displayed in the order they are defined here
# for more information, please refer to the documentation of jekyll-socials plugin: https://github.com/george-gca/jekyll-socials
#
# GitHub, LinkedIn, ORCID and Google Scholar are defined as custom entries (url/title/logo)
# instead of the built-in `github_username`, `linkedin_username`, `orcid_id` and `scholar_userid`
# keys, because jekyll-socials derives the hover tooltip of built-in keys from the key name
# (e.g. "Github username"). Custom entries use the `title` given here.
# Note: `scholar_userid` is also read by the publications layout for bib entries that set
# `google_scholar_id`; if you start using that field, add `scholar_userid` back.
